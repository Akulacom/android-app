name: Import reviewed watermark fixes

on:
  push:
    paths:
      - '.github/workflows/import-reviewed-fixes.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source bundle
        shell: bash
        run: |
          cat > /tmp/reviewed_sources.b64 <<'B64'
[...TRUNCATED FOR BREVITY...]
B64
          base64 -d /tmp/reviewed_sources.b64 > /tmp/reviewed_sources.tar.gz
          tar -xzf /tmp/reviewed_sources.tar.gz -C "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/com/akula/watermarkremover/EditorActivity.kt app/src/main/java/com/akula/watermarkremover/KeyframeMask.kt app/src/main/java/com/akula/watermarkremover/NeuralInpainter.kt app/src/main/java/com/akula/watermarkremover/SeamlessCloneProcessor.kt app/src/main/java/com/akula/watermarkremover/VideoProcessor.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Apply reviewed watermark fixes and feathered clone fill'
          git push origin main
