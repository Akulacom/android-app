name: Fix LaMa alpha artifacts

on:
  push:
    paths:
      - '.github/workflows/fix-lama-alpha.yml'

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Announce start
        run: gh issue comment 1 --body "### LAMA ALPHA FIX STARTED\nCommit: $GITHUB_SHA"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix transparent LaMa patch blending
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/akula/watermarkremover/NeuralInpainter.kt')
          s = p.read_text(encoding='utf-8')

          start = s.find('    private fun featherPatch(')
          end = s.find('    private fun combinedInputTensor(', start)
          if start < 0 or end < 0:
              raise SystemExit('featherPatch/combinedInputTensor block not found')

          new_feather = '''    private fun featherPatch(original: Bitmap, generated: Bitmap): Bitmap {
        val width = generated.width
        val height = generated.height
        val size = width * height
        val generatedPixels = IntArray(size)
        val outPixels = IntArray(size)

        generated.getPixels(generatedPixels, 0, width, 0, 0, width, height)

        // Реальная прозрачность по краям. Раньше RGB смешивался с AI-якорем,
        // но PNG оставался alpha=255, поэтому на движущемся видео появлялся
        // прямоугольник старого кадра вокруг удалённого watermark.
        val feather = max(8f, min(width, height) * 0.26f)
        for (y in 0 until height) {
            for (x in 0 until width) {
                val edge = minOf(
                    x.toFloat(),
                    (width - 1 - x).toFloat(),
                    y.toFloat(),
                    (height - 1 - y).toFloat()
                )
                val t = (edge / feather).coerceIn(0f, 1f)
                val smooth = t * t * (3f - 2f * t)
                val index = y * width + x
                val g = generatedPixels[index]
                outPixels[index] = Color.argb(
                    (255f * smooth).roundToInt().coerceIn(0, 255),
                    Color.red(g),
                    Color.green(g),
                    Color.blue(g)
                )
            }
        }

        return Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888).also {
            it.setPixels(outPixels, 0, width, 0, 0, width, height)
        }
    }

'''
          s = s[:start] + new_feather + s[end:]

          start = s.find('    private fun blend(')
          end = s.find('    private fun tensorToBitmap(', start)
          if start < 0 or end < 0:
              raise SystemExit('blend/tensorToBitmap block not found')

          new_blend = '''    private fun blend(a: Int, b: Int, alpha: Float): Int {
        if (alpha <= 0f) return a
        if (alpha >= 1f) return b

        val inv = 1f - alpha
        return Color.argb(
            (Color.alpha(a) * inv + Color.alpha(b) * alpha).roundToInt().coerceIn(0, 255),
            (Color.red(a) * inv + Color.red(b) * alpha).roundToInt().coerceIn(0, 255),
            (Color.green(a) * inv + Color.green(b) * alpha).roundToInt().coerceIn(0, 255),
            (Color.blue(a) * inv + Color.blue(b) * alpha).roundToInt().coerceIn(0, 255)
        )
    }

'''
          s = s[:start] + new_blend + s[end:]
          p.write_text(s, encoding='utf-8')
          print('LaMa alpha fix applied')
          PY

      - name: Build debug APK
        id: build
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Report result
        if: always()
        shell: bash
        run: |
          gh issue comment 1 --body "### LAMA ALPHA FIX RESULT\nPatch: ${{ steps.patch.outcome }}\nBuild: ${{ steps.build.outcome }}\nSource commit: $GITHUB_SHA"

      - name: Commit verified fix
        if: steps.patch.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/akula/watermarkremover/NeuralInpainter.kt
          if ! git diff --cached --quiet; then
            git commit -m "Fix LaMa rectangular patch artifacts"
            git push origin HEAD:main
          fi

      - name: Upload APK
        if: steps.patch.outcome == 'success' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-alpha-fix
          path: app/build/outputs/apk/debug/app-debug.apk
