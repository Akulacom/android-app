name: Harden current-frame LaMa

on:
  push:
    paths:
      - '.github/workflows/harden-lama-current-frame.yml'

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  harden-build-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Harden Bitmap ownership and audit pipeline
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/akula/watermarkremover/NeuralInpainter.kt')
          s = path.read_text(encoding='utf-8')

          start = s.find('        val resized = Bitmap.createScaledBitmap(')
          end = s.find('\n\n        val relativeMask = RectF(', start)
          if start < 0 or end < 0:
              raise SystemExit('resized block boundaries not found; refusing blind patch')

          new_resized = '''        // Android may return the source Bitmap when no scaling is required.
          // Keep an independent object so recycle() cannot invalidate contextBitmap/source.
          val resized = if (
              contextBitmap.width == MODEL_INPUT_SIZE &&
              contextBitmap.height == MODEL_INPUT_SIZE
          ) {
              contextBitmap.copy(Bitmap.Config.ARGB_8888, false)
          } else {
              Bitmap.createScaledBitmap(
                  contextBitmap,
                  MODEL_INPUT_SIZE,
                  MODEL_INPUT_SIZE,
                  true
              )
          }'''
          s = s[:start] + new_resized + s[end:]

          start = s.find('        val generatedContext = Bitmap.createScaledBitmap(')
          end = s.find('\n\n        val output = source.copy(', start)
          if start < 0 or end < 0:
              raise SystemExit('generatedContext block boundaries not found; refusing blind patch')

          new_generated = '''        // Same ownership rule for model output: if context is exactly 512x512,
          // createScaledBitmap may return generated512 itself.
          val generatedContext = if (
              generated512.width == contextW && generated512.height == contextH
          ) {
              generated512.copy(Bitmap.Config.ARGB_8888, false)
          } else {
              Bitmap.createScaledBitmap(
                  generated512,
                  contextW,
                  contextH,
                  true
              )
          }
          generated512.recycle()'''
          s = s[:start] + new_generated + s[end:]

          forbidden = [
              'AnchorPatch',
              'PatchOp',
              'reusePreviousPatch',
              'buildInterpolatedPatchOps',
              'buildOverlayCommand',
              'interpolatePatches'
          ]
          present = [name for name in forbidden if name in s]
          if present:
              raise SystemExit('Forbidden stale-frame pipeline remains: ' + ', '.join(present))

          required = [
              'lama_512_int8.onnx',
              'for (index in frameFiles.indices)',
              'inpaintCurrentFrame(',
              'compositeGeneratedRegion(',
              'longArrayOf(1, 4, height.toLong(), width.toLong())',
              '"-framerate", fpsText',
              'contextBitmap.copy(Bitmap.Config.ARGB_8888, false)',
              'generated512.copy(Bitmap.Config.ARGB_8888, false)'
          ]
          missing = [name for name in required if name not in s]
          if missing:
              raise SystemExit('Required invariants missing: ' + ', '.join(missing))

          path.write_text(s, encoding='utf-8')
          print('SOURCE AUDIT PASS')
          print('No stale-frame interpolation/overlay symbols remain')
          print('Bitmap ownership guards installed')
          PY

      - name: Bundle exact LaMa model used by normal build
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl -L --fail --retry 4 --retry-delay 3 \
            -o app/src/main/assets/lama_512_int8.onnx \
            "https://huggingface.co/g-ronimo/lama/resolve/8e20140b3ec5696f14ac3fac3b34b179ae4e1a15/lama_512_int8.onnx?download=true"
          echo "cab19978adc306622fe37ef60d4a52103b99c98141d499c2a2366a7ed1255dbe  app/src/main/assets/lama_512_int8.onnx" | sha256sum -c -

      - name: Build debug APK with captured log
        id: build
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/lama-hardening-build.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit $CODE

      - name: Report diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '### LAMA CURRENT-FRAME HARDENING'
            echo
            echo "Patch: ${{ steps.patch.outcome }}"
            echo "Build: ${{ steps.build.outcome }}"
            echo "Source: $GITHUB_SHA"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -f /tmp/lama-hardening-build.log ]; then
              echo
              echo '```text'
              tail -100 /tmp/lama-hardening-build.log
              echo '```'
            fi
          } > /tmp/lama-hardening-report.md
          gh issue comment 1 --body-file /tmp/lama-hardening-report.md

      - name: Commit only verified source
        if: steps.patch.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/akula/watermarkremover/NeuralInpainter.kt
          if ! git diff --cached --quiet; then
            git commit -m "Harden LaMa current-frame bitmap ownership"
            git push origin HEAD:main
          fi
