name: Claude Code

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  claude:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body || '', '@claude'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Probe Anthropic Messages API directly
        id: probe
        continue-on-error: true
        env:
          AGENTROUTER_API_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
        shell: bash
        run: |
          set -u
          KEY_LEN=${#AGENTROUTER_API_KEY}
          echo "key_len=${KEY_LEN}" >> "$GITHUB_OUTPUT"
          if [ "$KEY_LEN" -eq 0 ]; then
            echo "GitHub secret AGENTROUTER_API_KEY is empty or missing" > /tmp/probe-status.txt
            exit 1
          fi

          if [[ "$AGENTROUTER_API_KEY" == sk-j8h9*BPf ]]; then
            KEY_MASK_MATCH="MATCH"
          else
            KEY_MASK_MATCH="NO MATCH"
          fi

          MODELS=("claude-opus-4-8" "claude-opus-4-7")
          AUTH_MODES=("bearer" "x-api-key")
          SUCCESS=0

          for MODEL in "${MODELS[@]}"; do
            cat > /tmp/request.json <<EOF
          {
            "model": "${MODEL}",
            "max_tokens": 16,
            "messages": [{"role":"user","content":"Reply with exactly OK"}]
          }
          EOF

            for AUTH_MODE in "${AUTH_MODES[@]}"; do
              if [ "$AUTH_MODE" = "bearer" ]; then
                AUTH_HEADER="Authorization: Bearer ${AGENTROUTER_API_KEY}"
              else
                AUTH_HEADER="x-api-key: ${AGENTROUTER_API_KEY}"
              fi

              HTTP_CODE=$(curl -sS -o "/tmp/probe-${MODEL}-${AUTH_MODE}.json" -w "%{http_code}" \
                -X POST https://co.agentrouter.org/v1/messages \
                -H "$AUTH_HEADER" \
                -H "anthropic-version: 2023-06-01" \
                -H "content-type: application/json" \
                --data-binary @/tmp/request.json || true)

              ERROR=$(jq -r '.error.message // .message // empty' "/tmp/probe-${MODEL}-${AUTH_MODE}.json" 2>/dev/null || true)
              echo "${MODEL} ${AUTH_MODE} HTTP=${HTTP_CODE} ${ERROR}" >> /tmp/probe-attempts.txt

              if [ "$HTTP_CODE" = "200" ]; then
                TEXT=$(jq -r '.content[0].text // empty' "/tmp/probe-${MODEL}-${AUTH_MODE}.json" 2>/dev/null || true)
                echo "model=${MODEL}" >> "$GITHUB_OUTPUT"
                echo "auth_mode=${AUTH_MODE}" >> "$GITHUB_OUTPUT"
                echo "Key mask check: ${KEY_MASK_MATCH}. Direct Anthropic Messages OK; model=${MODEL}; auth=${AUTH_MODE}; response=${TEXT}" > /tmp/probe-status.txt
                SUCCESS=1
                break 2
              fi
            done
          done

          if [ "$SUCCESS" -ne 1 ]; then
            {
              echo "Key mask check against sk-j8h9...BPf: ${KEY_MASK_MATCH}; secret length=${KEY_LEN}"
              echo "Direct Anthropic Messages failed"
              cat /tmp/probe-attempts.txt
            } > /tmp/probe-status.txt
            exit 1
          fi

      - name: Run Claude Code CLI through AgentRouter
        id: claude
        if: steps.probe.outcome == 'success'
        continue-on-error: true
        env:
          AGENTROUTER_API_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
          ANTHROPIC_BASE_URL: https://co.agentrouter.org
          CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1"
          MODEL: ${{ steps.probe.outputs.model }}
          AUTH_MODE: ${{ steps.probe.outputs.auth_mode }}
        shell: bash
        run: |
          set +e
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          if [ "$AUTH_MODE" = "bearer" ]; then
            export ANTHROPIC_AUTH_TOKEN="$AGENTROUTER_API_KEY"
          else
            export ANTHROPIC_API_KEY="$AGENTROUTER_API_KEY"
          fi
          export ANTHROPIC_MODEL="$MODEL"

          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PROMPT=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")
          else
            PROMPT='Reply with exactly: AGENTROUTER CLI OK'
          fi

          claude -p "$PROMPT" \
            --model "$MODEL" \
            --output-format text \
            --max-turns 3 \
            --allowedTools "Read,Glob,Grep" \
            > /tmp/claude-response.txt 2> /tmp/claude-error.txt
          CODE=$?
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"

          if [ "$CODE" -ne 0 ] || [ ! -s /tmp/claude-response.txt ]; then
            {
              echo "Claude CLI failed; exit=${CODE}; model=${MODEL}; auth=${AUTH_MODE}"
              tail -60 /tmp/claude-error.txt
            } > /tmp/claude-status.txt
            exit 1
          fi

          echo "Claude Code CLI OK; model=${MODEL}; auth=${AUTH_MODE}" > /tmp/claude-status.txt
          exit 0

      - name: Post diagnostic or Claude response to issue
        if: github.event_name == 'issue_comment' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ steps.probe.outcome }}" != "success" ]; then
            BODY="$(cat /tmp/probe-status.txt 2>/dev/null || echo 'Direct Anthropic probe failed')\n\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          elif [ "${{ steps.claude.outcome }}" != "success" ]; then
            BODY="$(cat /tmp/probe-status.txt)\n$(cat /tmp/claude-status.txt 2>/dev/null || true)\n\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            BODY=$(cat /tmp/claude-response.txt)
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -f body="$BODY"
