name: Claude Code

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  claude:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body || '', '@claude'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: AgentRouter preflight and model selection
        id: router
        env:
          AGENTROUTER_API_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/models.json -w "%{http_code}" \
            -H "Authorization: Bearer ${AGENTROUTER_API_KEY}" \
            https://co.agentrouter.org/v1/models)
          echo "AgentRouter /v1/models HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "AgentRouter key/preflight failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          MODEL=$(jq -r '
            ([.data[].id | select(startswith("claude-opus-5"))][0]) //
            ([.data[].id | select(startswith("claude-opus-4-8"))][0]) //
            ([.data[].id | select(startswith("claude-opus-4-7"))][0]) //
            ([.data[].id | select(startswith("claude-"))][0]) // empty
          ' /tmp/models.json)

          if [ -z "${MODEL}" ]; then
            echo "No Claude model is available for this AgentRouter key"
            jq -r '.data[].id' /tmp/models.json | head -50
            exit 1
          fi

          echo "Selected Claude model: ${MODEL}"
          echo "model=${MODEL}" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code CLI
        id: claude
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.AGENTROUTER_API_KEY }}
          ANTHROPIC_BASE_URL: https://co.agentrouter.org
          CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1"
          MODEL: ${{ steps.router.outputs.model }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PROMPT=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")
          else
            PROMPT='Reply with exactly: AGENTROUTER CLI OK'
          fi

          echo "Running Claude Code CLI with model ${MODEL}"
          claude -p "$PROMPT" \
            --model "$MODEL" \
            --output-format text \
            --max-turns 3 \
            --allowedTools "Read,Glob,Grep" \
            > /tmp/claude-response.txt

          test -s /tmp/claude-response.txt
          echo "Claude Code CLI returned a response successfully"

      - name: Post Claude response to issue
        if: github.event_name == 'issue_comment' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BODY=$(cat /tmp/claude-response.txt)
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -f body="$BODY"
